name: CrownThrive Upstream Sync

on:
  workflow_dispatch:
  schedule:
    - cron: "23 * * * *"

permissions:
  contents: write

concurrency:
  group: crownthrive-bd-upstream-sync-main
  cancel-in-progress: false

jobs:
  sync-upstream-main:
    runs-on: ubuntu-latest
    steps:
      - name: Check out fork main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Fetch and merge upstream main safely
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "CrownThrive PentaSync"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/brilliantdirectories/brilliant-directories-mcp.git 2>/dev/null || true
          git fetch upstream main --tags

          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "Fork main already contains upstream main."
            exit 0
          fi

          git merge --no-edit upstream/main

          node scripts/schema-drift-check.js
          python3 scripts/skill-ref-check.py

          git push origin HEAD:main
